name: 🫣 Android CI

on:
  push:
    branches: [ "main", "amnezia-aether" ]
  pull_request:
    branches: [ "main", "amnezia-aether" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VARIANT: assembleWebsiteFullDebug
    steps:
    - name: 🥏 Checkout
      uses: actions/checkout@v6
    - name: ☕️ JDKv17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    # -- Aether engine (vendored Rust core, native/aether) ------------------
    # Upstream publishes no Android binaries, so the engine is built from
    # source here with cargo-ndk and installed into app/src/main/jniLibs/
    # (libaether.so + our JNI bridge libaetherjni.so) before Gradle runs.
    # Gradle needs no changes: src/main/jniLibs is packaged by default.
    # NOTE: the Rust build (quiche/boringssl + arti) is slow — expect
    # 20–40 min for both ABIs on a cold runner. Consider actions/cache
    # for ~/.cargo and native/aether/target if CI gets slow.
    - name: 🤖 Set up Android SDK + NDK (Aether engine)
      uses: android-actions/setup-android@v3
    - name: 🤖 Install NDK 26.3.11579264 (Aether engine)
      run: |
        yes | sdkmanager "ndk;26.3.11579264" > /dev/null
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "$GITHUB_ENV"
    - name: 🦀 Set up Rust (Aether engine Android targets)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi
    - name: 🦀 Install cargo-ndk (Aether engine)
      run: cargo install cargo-ndk --locked
    - name: 🦀 Native build deps (CMake for quiche/boringssl)
      run: |
        cmake --version
        sudo apt-get update -qq
        sudo apt-get install -y -qq cmake ninja-build pkg-config
    - name: 🔍 Verify vendored Aether core (never upgrades in CI)
      run: bash scripts/sync-core.sh --check
    - name: 🦀 Build Aether engine (libaether.so + JNI bridge)
      run: bash scripts/build-aether.sh
      env:
        ANDROID_API: "26"
        # Tor modes need the `tor` cargo feature (arti). If that ever fails
        # to compile for Android, set AETHER_FEATURES="" here and the UI
        # hides the Tor section instead of offering a broken mode.
        AETHER_FEATURES: "tor"
    - name: ⚡️ +x gradlew
      run: chmod +x gradlew
    - name: 🎪 Secrets
      if: success()
      # TODO: override iff it doesn't exist
      # developers.google.com/android/guides/google-services-plugin#adding_the_json_file
      run: |
        mkdir -p app/src/debug
        echo "${GSCV_TEST_JSON}" > app/src/debug/google-services.json
        # expected: l:29 w:45 m:691
        wc -lwm app/src/debug/google-services.json
        if [ -z "$GSCV_TEST_JSON" ]; then
          echo "VARIANT=assembleFdroidFullDebug" >> "$GITHUB_ENV"
        fi
      env:
        GSCV_TEST_JSON: ${{ secrets.GOOGLE_SERVICES_TEST_JSON }}
    - name: 🚂 Assemble
      if: success()
      run: |
        ./gradlew lint
        ./gradlew \
          ${VARIANT} \
          --info \
          --warning-mode all
      env:
        VARIANT: ${{ env.VARIANT }}
    - name: 📦 Upload APK
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: rethink-apk-${{ github.sha }}
        path: app/build/outputs/apk/**/debug/*.apk
        if-no-files-found: error
        retention-days: 30
